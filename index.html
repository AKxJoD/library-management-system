<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Management System</title><link rel="stylesheet" href="assets/style.css?v=3"></head><body><section id="authView" class="auth-shell"><div class="auth-card"><div class="brand">📚 LMS</div><h1>Library Management</h1><p class="muted">Cloud database powered library system</p><form id="authForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" minlength="6" required><button id="authSubmit" class="primary" type="submit">Sign in</button></form><button id="toggleAuth" class="secondary" type="button">Create account</button><p id="authMsg" class="message"></p></div></section><section id="mainView" class="hidden"><header class="topbar"><div><b>📚 Library Management System</b><p id="userEmail"></p></div><button id="logout" class="ghost" type="button">Logout</button></header><main class="container"><h1>Library Dashboard</h1><div id="message"></div><div class="stats"><div><span>Total Books</span><strong id="totalBooks">0</strong></div><div><span>Available</span><strong id="availableBooks">0</strong></div><div><span>Issued</span><strong id="issuedBooks">0</strong></div><div><span>Members</span><strong id="totalMembers">0</strong></div></div><section class="panel"><h2>Books</h2><div class="table-wrap"><table><thead><tr><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Status</th></tr></thead><tbody id="books"></tbody></table></div></section><section class="panel"><h2>Members</h2><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th></tr></thead><tbody id="members"></tbody></table></div></section></main></section><script src="assets/app2.js?v=3"></script><script>document.getElementById('toggleAuth').addEventListener('click',()=>window.signup());window.signup=window.signup||function(){document.getElementById('authMsg').textContent='Please wait for the application to load.'};</script></body></html>
